<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="工作台" />
<meta name="theme-color" content="#4f7cff" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%234f7cff'/><path d='M20 33 L29 42 L45 24' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<title>我的日常工作台</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --card-2: #f8fafc; --text: #1f2430;
    --muted: #7a8194; --line: #e8ebf2; --accent: #4f7cff; --accent-soft: #eaf0ff;
    --green: #18a957; --red: #e5484d; --shadow: 0 6px 24px rgba(31,36,48,.06);
  }
  html[data-theme="dark"] {
    --bg: #14161c; --card: #1e212a; --card-2: #232732; --text: #e7eaf1;
    --muted: #99a1b3; --line: #2c313d; --accent: #6b93ff; --accent-soft: #232b44;
    --green: #2ec27e; --red: #ff6b6f; --shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .app { display: flex; align-items: flex-start; gap: 18px; max-width: 1100px; margin: 0 auto; padding: max(22px, env(safe-area-inset-top)) 18px 60px; }

  /* Sidebar */
  .sidebar { width: 200px; flex: none; position: sticky; top: 18px; }
  .brand { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 6px; }
  .nav-item {
    text-align: left; border: 1px solid transparent; background: transparent; color: var(--muted);
    padding: 11px 14px; border-radius: 12px; cursor: pointer; font-size: 15px; font-family: inherit; transition: .15s;
    display: flex; align-items: center; gap: 10px;
  }
  .nav-item:hover { background: var(--card); color: var(--text); }
  .nav-item.active { background: var(--accent); color: #fff; box-shadow: var(--shadow); }
  .side-foot { margin-top: 18px; }
  .icon-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer; font-size: 18px;
    display: grid; place-items: center; transition: .15s;
  }
  .icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .fs-fab {
    position: fixed; right: 18px; bottom: 18px; z-index: 100;
    width: 46px; height: 46px; border-radius: 50%;
    box-shadow: var(--shadow); background: var(--accent); color: #fff; border: none;
  }
  .fs-fab:hover { filter: brightness(.95); }
  @media (max-width: 760px) { .fs-fab { right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); } }

  /* Main */
  .main { flex: 1; min-width: 0; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .hi h1 { font-size: 22px; margin: 0; font-weight: 700; }
  .hi .date { color: var(--muted); font-size: 14px; }
  .clock { font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 700; color: var(--accent); }
  .clock small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 6px; }

  .view { display: none; }
  .view.active { display: block; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
  .card h2 { font-size: 15px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .card h2 .tag { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: auto; }

  input[type="text"], textarea, input[type="date"], input[type="url"] {
    flex: 1; border: 1px solid var(--line); background: var(--card-2); color: var(--text);
    border-radius: 10px; padding: 9px 11px; font-size: 14px; font-family: inherit; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 200px; line-height: 1.6; width: 100%; }
  .btn { border: none; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 16px; font-size: 14px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: .15s; }
  .btn:hover { filter: brightness(1.05); }
  .btn.ghost { background: var(--card-2); color: var(--text); border: 1px solid var(--line); }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }

  .add-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  ul.list { list-style: none; margin: 0; padding: 0; overflow: auto; max-height: 420px; }
  ul.list li { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px dashed var(--line); }
  ul.list li:last-child { border-bottom: none; }
  .check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); cursor: pointer; flex: none; display: grid; place-items: center; transition: .15s; }
  .check.done { background: var(--green); border-color: var(--green); color: #fff; font-size: 13px; }
  .todo-text { flex: 1; word-break: break-word; }
  .todo-text.done { text-decoration: line-through; color: var(--muted); }
  .del { color: var(--muted); cursor: pointer; border: none; background: none; font-size: 16px; padding: 2px 6px; }
  .del:hover { color: var(--red); }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 4px; }
  .rec-date { flex: none; width: 92px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rec-body { flex: 1; display: flex; flex-direction: column; gap: 2px; word-break: break-word; min-width: 0; }
  .rec-name { font-size: 14px; font-weight: 600; }
  .rec-note { font-size: 12px; color: var(--muted); }

  .note-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .note-head input[type="date"] { flex: none; max-width: 180px; }
  .saved { font-size: 12px; color: var(--green); margin-left: auto; opacity: 0; transition: .3s; }
  .saved.show { opacity: 1; }

  .links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .link-chip { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); text-decoration: none; color: var(--text); position: relative; transition: .15s; }
  .link-chip:hover { border-color: var(--accent); transform: translateY(-2px); }
  .link-chip .lk-name { font-weight: 600; font-size: 14px; }
  .link-chip .lk-url { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-chip .lk-del { position: absolute; top: 4px; right: 6px; color: var(--muted); cursor: pointer; font-size: 13px; opacity: 0; }
  .link-chip:hover .lk-del { opacity: 1; }
  .link-chip .lk-del:hover { color: var(--red); }

  /* Habit month view */
  .month-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .month-bar .mlabel { font-weight: 700; font-size: 15px; min-width: 96px; text-align: center; }
  .month-bar button.round { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--card-2); color: var(--text); cursor: pointer; font-size: 16px; }
  .month-bar button.round:hover { border-color: var(--accent); color: var(--accent); }
  .colorpick { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .colorpick input[type="color"] { width: 15px; height: 15px; border: none; border-radius: 50%; background: transparent !important; cursor: pointer; padding: 0; appearance: none; -webkit-appearance: none; }
  .colorpick input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .colorpick input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
  .cal-dow { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
  .cal-cell { aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: .15s; font-size: 13px; }
  .cal-cell:hover { border-color: var(--accent); }
  .cal-cell.today { border-color: var(--accent); font-weight: 700; }
  .cal-cell.sel { box-shadow: 0 0 0 2px var(--accent) inset; }
  .cal-cell.blank { border: none; background: transparent; cursor: default; }
  .cal-cell .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 3px; }
  .habit-sel { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .habit-sel b { color: var(--text); }
  .habits { display: flex; flex-wrap: wrap; gap: 10px; }
  .habit { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); cursor: pointer; user-select: none; transition: .15s; }
  .habit.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .habit-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .habit-head h2 { margin: 0; }
  .plus-btn { width: 34px; height: 34px; border-radius: 999px; border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--accent); font-size: 20px; line-height: 1; cursor: pointer; flex: none; }
  .plus-btn:hover { background: var(--accent); color: #fff; }
  .dot-color {
    width: 30px; height: 30px; border: none; border-radius: 50%;
    cursor: pointer; padding: 0; flex: none; margin-left: auto;
    appearance: none; -webkit-appearance: none;
    background: transparent !important;
  }
  .dot-color::-webkit-color-swatch-wrapper { padding: 0; }
  .dot-color::-webkit-color-swatch { border: none; border-radius: 50%; }

  /* Habit rows (per-habit month views) */
  .habit-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .habit-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card-2); }
  .habit-row.sel { border-color: var(--accent); background: var(--accent-soft); }
  .habit-dot { width: 20px; height: 20px; border: none; border-radius: 50%; flex: none; cursor: pointer; padding: 0; appearance: none; -webkit-appearance: none; background: transparent !important; }
  .habit-dot::-webkit-color-swatch-wrapper { padding: 0; }
  .habit-dot::-webkit-color-swatch { border: none; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
  .habit-icon { font-size: 22px; line-height: 1; flex: none; width: 28px; text-align: center; }
  .habit-name { flex: 1; font-weight: 600; cursor: pointer; word-break: break-word; }
  .habit-name.done { color: var(--green); }
  .habit-name.done::after { content: " ✓"; }
  .habit-open { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 5px 12px; font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .habit-open:hover { background: var(--accent); color: #fff; }
  .habit-del { color: var(--muted); cursor: pointer; border: none; background: none; font-size: 16px; padding: 2px 6px; }
  .habit-del:hover { color: var(--red); }
  .cur-icon-wrap { position: relative; display: inline-flex; align-items: center; }
  .cur-icon { font-size: 24px; line-height: 1; cursor: pointer; padding: 2px 4px; border-radius: 8px; user-select: none; -webkit-user-select: none; }
  .cur-icon:hover { background: var(--accent-soft); }
  .icon-grid { position: absolute; top: 100%; right: 0; z-index: 5; display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.14); max-width: 340px; }
  .icon-grid button { font-size: 20px; line-height: 1; width: 32px; height: 32px; border: 1px solid transparent; border-radius: 8px; background: var(--card-2); cursor: pointer; }
  .icon-grid button:hover { background: var(--accent-soft); border-color: var(--accent); }
  .icon-grid button.on { background: var(--accent); border-color: var(--accent); }
  .open-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .open-hint { font-size: 13px; color: var(--muted); }
  .month-panel { margin-top: 4px; }
  .cal-cell.on { background: var(--accent-soft); border-color: var(--accent); }

  /* Diet */
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { border: 1px solid var(--line); background: var(--card-2); color: var(--muted); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; font-family: inherit; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .total { margin-top: 12px; font-size: 15px; } .total b { color: var(--accent); font-size: 18px; }

  footer { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  footer .hint { color: var(--muted); font-size: 12px; margin-left: auto; }

  #menuBtn { display: none; }
  .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; }
  .backdrop.show { display: block; }
  @media (max-width: 760px) {
    .app { flex-direction: column; padding: 14px 12px 50px; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; height: 100%; width: 230px;
      background: var(--bg); z-index: 50; padding: calc(18px + env(safe-area-inset-top)) 14px 18px; overflow-y: auto;
      transform: translateX(-100%); transition: transform .25s ease; box-shadow: 2px 0 16px rgba(0,0,0,.18);
    }
    .sidebar.open { transform: translateX(0); }
    #menuBtn { display: grid; }
    .clock { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span>🌿 工作台</span>
      <div class="brand-btns">
        <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
      </div>
    </div>
    <nav id="nav">
      <button class="nav-item" data-view="note">📝 每日记录</button>
      <button class="nav-item" data-view="todo">✅ 待办</button>
      <button class="nav-item" data-view="link">🔗 快捷链接</button>
      <button class="nav-item" data-view="habit">🌱 习惯打卡</button>
      <button class="nav-item" data-view="record">📁 收发文</button>
    </nav>
  </aside>

  <div class="main">
    <header class="top">
      <div style="display:flex; align-items:center; gap:10px; min-width:0;">
        <button class="icon-btn" id="menuBtn" title="菜单">☰</button>
        <div class="hi">
          <h1 id="greet">你好</h1>
          <span class="date" id="todayDate"></span>
        </div>
      </div>
      <div class="clock"><span id="clock">--:--:--</span><small id="sec">周一</small></div>
    </header>

    <!-- 每日记录 -->
    <section class="view card" data-view="note">
      <h2>📝 每日记录</h2>
      <div class="note-head">
        <input type="date" id="noteDate" />
        <span class="saved" id="noteSaved">已保存</span>
      </div>
      <textarea id="noteArea" placeholder="随手记点什么，按日期自动保存…"></textarea>
    </section>

    <!-- 待办 -->
    <section class="view card" data-view="todo">
      <h2>✅ 今日待办 <span class="tag" id="todoCount"></span></h2>
      <div class="add-row">
        <input type="text" id="todoInput" placeholder="想做点什么…" maxlength="120" />
        <button class="btn" id="todoAdd">添加</button>
      </div>
      <ul class="list" id="todoList"></ul>
    </section>

    <!-- 快捷链接 -->
    <section class="view card" data-view="link">
      <h2>🔗 快捷链接 <span class="tag" id="linkCount"></span></h2>
      <div class="add-row">
        <input type="text" id="linkName" placeholder="名称" maxlength="20" style="flex:.6" />
        <input type="url" id="linkUrl" placeholder="https://…" maxlength="200" style="flex:1.4" />
        <button class="btn" id="linkAdd">添加</button>
      </div>
      <div class="links-grid" id="linksGrid"></div>
    </section>

    <!-- 习惯打卡 -->
    <section class="view card" data-view="habit">
      <div class="habit-head">
        <h2>🌱 习惯打卡</h2>
        <button class="plus-btn" id="addHabit" title="添加习惯">＋</button>
      </div>
      <div class="habit-list" id="habitList"></div>
      <div class="open-wrap">
        <button class="btn ghost sm" id="openMonth">📅 打开月视图</button>
        <span class="open-hint" id="openHint">选择习惯后点「打开月视图」</span>
      </div>
      <div class="month-panel" id="monthPanel" style="display:none">
        <div class="month-bar">
          <button class="round" id="prevM">‹</button>
          <span class="mlabel" id="monthLabel"></span>
          <button class="round" id="nextM">›</button>
          <span class="cur-icon-wrap"><span class="cur-icon" id="curIcon" title="长按修改图标">🔵</span><div class="icon-grid" id="iconGrid" style="display:none"></div></span>
          <span class="colorpick"><input type="color" id="dotColor" value="#18a957" title="小圆点颜色" /></span>
        </div>
        <div class="calendar" id="calendar"></div>
        <div class="habit-sel">正在查看：<b id="habitSelLabel"></b>（点日历日期可打卡 / 取消）</div>
      </div>
    </section>

    <!-- 收发文记录 -->
    <section class="view card" data-view="record">
      <h2>📁 收发文记录</h2>
      <div class="tabs" id="recTabs">
        <button class="tab active" data-tab="in">📥 收文</button>
        <button class="tab" data-tab="out">📤 发文</button>
      </div>
      <div class="add-row">
        <input type="date" id="recDate" style="max-width:150px" />
        <input type="text" id="recName" placeholder="文件名" />
        <input type="text" id="recNote" placeholder="备注" style="flex:1" />
        <button class="btn" id="recAdd">添加</button>
      </div>
      <div class="add-row">
        <input type="search" id="recSearch" placeholder="🔍 搜索文件名或备注…" style="flex:1" />
      </div>
      <ul class="list" id="recList"></ul>
      <div class="total">共 <b id="recCount">0</b> 条</div>
    </section>

    <footer>
      <button class="btn ghost sm" id="backupBtn">⬇ 备份数据</button>
      <button class="btn ghost sm" id="restoreBtn">⬆ 恢复数据</button>
      <input type="file" id="restoreFile" accept="application/json" style="display:none" />
      <span class="hint">数据保存在本机浏览器，可备份后在手机端恢复以同步</span>
    </footer>
  </div>
</div>
<div class="backdrop" id="backdrop"></div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var KEY = { todo: "wb_todo", note: "wb_note", link: "wb_link", habit: "wb_habit", habitList: "wb_habitlist", habitColors: "wb_habitcolors", habitIcons: "wb_habiticons", theme: "wb_theme", view: "wb_view", dot: "wb_dot", record: "wb_record" };
  var DEF_HABITS = ["喝水", "运动", "阅读", "早睡"];
  var WK = ["周日","周一","周二","周三","周四","周五","周六"];

  function load(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function todayStr(d) { d = d || new Date(); var m = ("0"+(d.getMonth()+1)).slice(-2), day = ("0"+d.getDate()).slice(-2); return d.getFullYear()+"-"+m+"-"+day; }
  function pad(n) { return ("0"+n).slice(-2); }

  // Theme
  var theme = load(KEY.theme, "auto");
  function applyTheme(t) {
    if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    $("themeBtn").textContent = t === "dark" ? "☀️" : "🌙";
    save(KEY.theme, theme);
  }
  applyTheme(theme);
  $("themeBtn").onclick = function () { var cur = document.documentElement.getAttribute("data-theme"); theme = cur === "dark" ? "light" : "dark"; applyTheme(theme); };

  // Fullscreen toggle
  var fsBtn = $("fsBtn");
  function toggleFs() {
    var d = document, de = d.documentElement;
    var fsEl = d.fullscreenElement || d.webkitFullscreenElement;
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    var exit = d.exitFullscreen || d.webkitExitFullscreen;
    try {
      if (!fsEl && req) { var p = req.call(de); if (p && p.catch) p.catch(function () {}); }
      else if (exit) { exit.call(d); }
    } catch (e) {}
  }
  document.addEventListener('click', function (e) { if (e.target && e.target.id === 'fsBtn') toggleFs(); });

  // Clock
  function tick() {
    var d = new Date();
    $("clock").textContent = pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
    $("sec").textContent = WK[d.getDay()];
    $("todayDate").textContent = todayStr(d) + " " + WK[d.getDay()];
    var h = d.getHours();
    $("greet").textContent = (h < 6 ? "夜深了" : h < 12 ? "早上好" : h < 14 ? "中午好" : h < 18 ? "下午好" : "晚上好") + " 👋";
  }
  tick(); setInterval(tick, 1000);

  // View switching (default: habit)
  var activeView = load(KEY.view, "habit");
  function switchView(v) {
    activeView = v; save(KEY.view, v);
    document.querySelectorAll(".view").forEach(function (s) { s.classList.toggle("active", s.getAttribute("data-view") === v); });
    document.querySelectorAll(".nav-item").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-view") === v); });
  }
  function openSidebar() { document.querySelector(".sidebar").classList.add("open"); $("backdrop").classList.add("show"); }
  function closeSidebar() { document.querySelector(".sidebar").classList.remove("open"); $("backdrop").classList.remove("show"); }
  $("menuBtn").onclick = function () { var s = document.querySelector(".sidebar"); s.classList.contains("open") ? closeSidebar() : openSidebar(); };
  $("backdrop").onclick = closeSidebar;
  document.querySelectorAll(".nav-item").forEach(function (b) { b.onclick = function () { switchView(b.getAttribute("data-view")); if (matchMedia("(max-width:760px)").matches) closeSidebar(); }; });
  switchView(activeView);

  // Todo
  var todos = load(KEY.todo, []);
  function renderTodo() {
    var ul = $("todoList"); ul.innerHTML = "";
    if (!todos.length) { ul.innerHTML = '<div class="empty">还没有待办，加一条吧～</div>'; }
    todos.forEach(function (t) {
      var li = document.createElement("li");
      var c = document.createElement("div"); c.className = "check" + (t.done ? " done" : ""); c.textContent = t.done ? "✓" : "";
      c.onclick = function () { t.done = !t.done; save(KEY.todo, todos); renderTodo(); };
      var span = document.createElement("span"); span.className = "todo-text" + (t.done ? " done" : ""); span.textContent = t.text;
      var del = document.createElement("button"); del.className = "del"; del.textContent = "✕"; del.title = "删除";
      del.onclick = function () { todos = todos.filter(function (x) { return x !== t; }); save(KEY.todo, todos); renderTodo(); };
      li.appendChild(c); li.appendChild(span); li.appendChild(del); ul.appendChild(li);
    });
    var left = todos.filter(function (t) { return !t.done; }).length;
    $("todoCount").textContent = todos.length ? (left + " 项待完成 / 共 " + todos.length) : "";
  }
  function addTodo() { var v = $("todoInput").value.trim(); if (!v) return; todos.push({ text: v, done: false }); $("todoInput").value = ""; save(KEY.todo, todos); renderTodo(); $("todoInput").focus(); }
  $("todoAdd").onclick = addTodo;
  $("todoInput").addEventListener("keydown", function (e) { if (e.key === "Enter") addTodo(); });
  renderTodo();

  // Notes
  var notes = load(KEY.note, {});
  var noteTimer = null;
  function loadNote(date) { $("noteArea").value = notes[date] || ""; $("noteDate").value = date; }
  $("noteArea").addEventListener("input", function () {
    var d = $("noteDate").value || todayStr();
    notes[d] = $("noteArea").value;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { save(KEY.note, notes); flashSaved(); }, 500);
  });
  $("noteDate").addEventListener("change", function () { loadNote($("noteDate").value); });
  function flashSaved() { var s = $("noteSaved"); s.classList.add("show"); setTimeout(function () { s.classList.remove("show"); }, 1200); }
  loadNote(todayStr());

  // Links
  var links = load(KEY.link, [
    { name: "WorkBuddy", url: "https://www.codebuddy.cn" },
    { name: "腾讯文档", url: "https://docs.qq.com" }
  ]);
  function renderLinks() {
    var g = $("linksGrid"); g.innerHTML = "";
    links.forEach(function (l, i) {
      var a = document.createElement("a"); a.className = "link-chip"; a.href = l.url; a.target = "_blank"; a.rel = "noopener";
      a.innerHTML = '<span class="lk-del" title="删除">✕</span><span class="lk-name"></span><span class="lk-url"></span>';
      a.querySelector(".lk-name").textContent = l.name;
      a.querySelector(".lk-url").textContent = l.url.replace(/^https?:\/\//, "");
      a.querySelector(".lk-del").onclick = function (e) { e.preventDefault(); e.stopPropagation(); links.splice(i,1); save(KEY.link, links); renderLinks(); };
      g.appendChild(a);
    });
    $("linkCount").textContent = links.length ? (links.length + " 个") : "";
  }
  function addLink() {
    var n = $("linkName").value.trim(), u = $("linkUrl").value.trim(); if (!n || !u) return;
    if (!/^https?:\/\//.test(u)) u = "https://" + u;
    links.push({ name: n, url: u }); $("linkName").value = ""; $("linkUrl").value = ""; save(KEY.link, links); renderLinks();
  }
  $("linkAdd").onclick = addLink;
  $("linkUrl").addEventListener("keydown", function (e) { if (e.key === "Enter") addLink(); });
  renderLinks();

  // Habits + per-habit month view
  var habits = load(KEY.habit, {});
  var habitList = load(KEY.habitList, DEF_HABITS.slice());
  var PALETTE = ["#18a957","#4f7cff","#e5484d","#f5a623","#9b59b6","#16a085","#e67e22","#3498db","#e84393","#2d3436"];
  // 习惯默认图标（按名称自动匹配）
  var DEF_ICONS = {
    "喝水":"💧","运动":"🏃","阅读":"📖","早睡":"😴","跑步":"🏃‍♂️","健身":"💪","冥想":"🧘","早起":"🌅",
    "背单词":"📚","练字":"✍️","记账":"📝","护肤":"🧴","散步":"🚶","瑜伽":"🧘‍♀️","游泳":"🏊","骑行":"🚴",
    "写作":"✒️","学英语":"🇬🇧","听书":"🎧","喝咖啡":"☕","吃饭":"🍚","减肥":"🥗","吃药":"💊","量体重":"⚖️",
    "晒太阳":"🌞","午睡":"😪","整理":"🧹","洗漱":"🪥","洗澡":"🛁","听音乐":"🎵","弹琴":"🎹","唱歌":"🎤",
    "画画":"🎨","摄影":"📷","钓鱼":"🎣","旅行":"✈️","看书":"📚","学习":"📖","复习":"📒","刷题":"✏️",
    "上课":"🏫","上班":"💼","开会":"📊","编程":"💻","写日记":"📔","复盘":"📝","计划":"📅","目标":"🎯",
    "存钱":"🐷","理财":"📈","吃水果":"🍎","吃蔬菜":"🥦","吃早餐":"🥞","戒烟":"🚭","戒酒":"🍺","戒糖":"🍬",
    "拉伸":"🤸","打球":"🏀","足球":"⚽","篮球":"🏀","排球":"🏐","网球":"🎾","羽毛球":"🏸","乒乓球":"🏓",
    "登山":"🧗","徒步":"🥾","跳舞":"💃","书法":"🖌️","围棋":"⚫","象棋":"♟️","拼图":"🧩","养花":"🌸",
    "种草":"🌱","浇水":"🪴","喂猫":"🐱","遛狗":"🐕","读经":"📜","祷告":"🙏","志愿":"🤝","感恩":"🙏",
    "深呼吸":"🌬️","正念":"🧠","不熬夜":"🌛","少手机":"📵","断网":"🌐"
  };
  // 改图标时可选的预设图标池
  var ICON_POOL = [
    "💧","🏃","📖","😴","🏃‍♂️","💪","🧘","🌅","📚","✍️","📝","🧴","🚶","🧘‍♀️","🏊","🚴",
    "✒️","🇬🇧","🎧","☕","🍚","🥗","💊","⚖️","🌞","😪","🧹","🪥","🛁","🎵","🎹","🎤",
    "🎨","📷","🎣","✈️","📒","✏️","🏫","💼","📊","💻","📔","📅","🎯","🐷","📈","🍎",
    "🥦","🥞","🚭","🍺","🍬","🤸","🏀","⚽","🏐","🎾","🏸","🏓","🧗","🥾","💃","🖌️",
    "⚫","♟️","🧩","🌸","🌱","🪴","🐱","🐕","📜","🙏","🤝","🌬️","🧠","🌛","📵","🌐",
    "🔵","🌟","⭐","❤️","🔥","🌈","⚡","🌿"
  ];
  var habitColors = load(KEY.habitColors, null);
  var habitIcons = load(KEY.habitIcons, null);
  if (!habitColors || typeof habitColors !== "object") {
    habitColors = {};
    var oldDot = load(KEY.dot, null);
    habitList.forEach(function (h, i) { habitColors[h] = oldDot || PALETTE[i % PALETTE.length]; });
  }
  if (!habitIcons || typeof habitIcons !== "object") { habitIcons = {}; }
  habitList.forEach(function (h, i) {
    if (!habitColors[h]) habitColors[h] = PALETTE[i % PALETTE.length];
    if (!habitIcons[h]) habitIcons[h] = DEF_ICONS[h] || "🔵";
  });
  var curHabit = habitList[0] || "";
  var calY = new Date().getFullYear(), calM = new Date().getMonth();

  function habitDoneToday(h) { var t = todayStr(); return !!(habits[t] && habits[t][h]); }

  function openMonth(h) {
    if (!h) return;
    curHabit = h;
    $("dotColor").value = habitColors[h] || "#18a957";
    var ic = habitIcons[h] || DEF_ICONS[h] || "🔵";
    $("curIcon").textContent = ic;
    buildIconGrid(ic);
    $("iconGrid").style.display = "none";
    renderHabitList();
    $("monthPanel").style.display = "";
    $("openHint").textContent = "正在查看「" + h + "」";
    renderMonth();
  }

  function buildIconGrid(cur) {
    var grid = $("iconGrid"); grid.innerHTML = "";
    ICON_POOL.forEach(function (em) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = em;
      if (em === cur) b.className = "on";
      b.onclick = function (e) {
        e.stopPropagation();
        habitIcons[curHabit] = em; save(KEY.habitIcons, habitIcons);
        $("curIcon").textContent = em;
        buildIconGrid(em);
        renderHabitList();
      };
      grid.appendChild(b);
    });
  }

  function renderMonth() {
    var cal = $("calendar"); cal.innerHTML = "";
    ["日","一","二","三","四","五","六"].forEach(function (w) { var d = document.createElement("div"); d.className = "cal-dow"; d.textContent = w; cal.appendChild(d); });
    var first = new Date(calY, calM, 1).getDay();
    var days = new Date(calY, calM + 1, 0).getDate();
    var t = todayStr();
    var color = habitColors[curHabit] || "#18a957";
    for (var i = 0; i < first; i++) { var b = document.createElement("div"); b.className = "cal-cell blank"; cal.appendChild(b); }
    for (var d = 1; d <= days; d++) {
      var ds = calY + "-" + pad(calM + 1) + "-" + pad(d);
      var on = !!(habits[ds] && habits[ds][curHabit]);
      var cell = document.createElement("div");
      cell.className = "cal-cell" + (ds === t ? " today" : "") + (on ? " on" : "");
      cell.appendChild(document.createTextNode(d));
      if (on) { var dot = document.createElement("span"); dot.className = "dot"; dot.style.background = color; cell.appendChild(dot); }
      cell.onclick = function (ds2) { return function () {
        if (!habits[ds2]) habits[ds2] = {};
        habits[ds2][curHabit] = !habits[ds2][curHabit];
        if (!habits[ds2][curHabit]) delete habits[ds2][curHabit];
        save(KEY.habit, habits); renderHabitList(); renderMonth();
      }; }(ds);
      cal.appendChild(cell);
    }
    $("monthLabel").textContent = calY + "年" + (calM + 1) + "月";
    $("habitSelLabel").textContent = curHabit || "—";
  }

  function renderHabitList() {
    var box = $("habitList"); box.innerHTML = "";
    if (!habitList.length) { box.innerHTML = '<div class="empty">还没有习惯，点右上角 ＋ 添加一个吧～</div>'; }
    habitList.forEach(function (h) {
      var row = document.createElement("div");
      row.className = "habit-row" + (h === curHabit ? " sel" : "");
      var icon = document.createElement("span"); icon.className = "habit-icon"; icon.textContent = habitIcons[h] || DEF_ICONS[h] || "🔵"; icon.title = "在月视图里可改圆点颜色";
      var name = document.createElement("span");
      name.className = "habit-name" + (habitDoneToday(h) ? " done" : "");
      name.textContent = h; name.title = "点我打开月视图";
      name.onclick = function () { openMonth(h); };
      var open = document.createElement("button");
      open.className = "habit-open"; open.textContent = "打开"; open.title = "打开月视图";
      open.onclick = function (e) { e.stopPropagation(); openMonth(h); };
      var del = document.createElement("button");
      del.className = "habit-del"; del.textContent = "✕"; del.title = "删除习惯";
      del.onclick = function (e) {
        e.stopPropagation();
        if (confirm("删除习惯「" + h + "」？\n所有日期的打卡记录会一并清除。")) {
          habitList = habitList.filter(function (x) { return x !== h; });
          save(KEY.habitList, habitList);
          delete habitColors[h]; save(KEY.habitColors, habitColors);
          delete habitIcons[h]; save(KEY.habitIcons, habitIcons);
          for (var dd in habits) { if (habits[dd] && habits[dd][h] !== undefined) delete habits[dd][h]; }
          save(KEY.habit, habits);
          if (curHabit === h) curHabit = habitList[0] || "";
          renderHabitList(); renderMonth();
        }
      };
      row.appendChild(icon); row.appendChild(name); row.appendChild(open); row.appendChild(del);
      box.appendChild(row);
    });
  }

  $("addHabit").onclick = function () {
    var name = prompt("新习惯名称：");
    if (!name) return; name = name.trim(); if (!name) return;
    if (habitList.indexOf(name) >= 0) { alert("已存在该习惯"); return; }
    habitList.push(name); save(KEY.habitList, habitList);
    habitColors[name] = PALETTE[habitList.length % PALETTE.length]; save(KEY.habitColors, habitColors);
    if (!habitIcons[name]) { habitIcons[name] = DEF_ICONS[name] || "🔵"; }
    save(KEY.habitIcons, habitIcons);
    renderHabitList();
  };
  $("openMonth").onclick = function () { if (!curHabit && habitList[0]) curHabit = habitList[0]; openMonth(curHabit); };
  $("prevM").onclick = function () { calM--; if (calM < 0) { calM = 11; calY--; } renderMonth(); };
  $("nextM").onclick = function () { calM++; if (calM > 11) { calM = 0; calY++; } renderMonth(); };
  $("dotColor").addEventListener("input", function () { if (!curHabit) return; habitColors[curHabit] = this.value; save(KEY.habitColors, habitColors); renderHabitList(); renderMonth(); });
  // 长按图标打开选图网格
  (function () {
    var el = $("curIcon");
    var timer = null;
    function start() { timer = setTimeout(function () { buildIconGrid(el.textContent); $("iconGrid").style.display = "grid"; }, 550); }
    function stop() { clearTimeout(timer); }
    el.addEventListener("mousedown", start);
    el.addEventListener("mouseup", stop);
    el.addEventListener("mouseleave", stop);
    el.addEventListener("touchstart", start, { passive: true });
    el.addEventListener("touchend", stop);
    el.addEventListener("touchmove", stop);
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); buildIconGrid(el.textContent); $("iconGrid").style.display = "grid"; });
  })();
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".icon-grid") && e.target.id !== "curIcon") { $("iconGrid").style.display = "none"; }
  });
  renderHabitList(); renderMonth();

  // ===== 收发文记录板块 =====
  var records = load(KEY.record, []);
  if (!Array.isArray(records)) records = [];
  var recType = "in";
  function recTab(t) {
    recType = t;
    document.querySelectorAll("#recTabs .tab").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-tab") === t); });
    renderRecords();
  }
  document.querySelectorAll("#recTabs .tab").forEach(function (b) { b.onclick = function () { recTab(b.getAttribute("data-tab")); }; });
  $("recDate").value = todayStr();
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function renderRecords() {
    var box = $("recList"); box.innerHTML = "";
    var q = ($("recSearch").value || "").trim().toLowerCase();
    var rows = records
      .map(function (r, i) { return { r: r, i: i }; })
      .filter(function (o) { return o.r.type === recType; })
      .filter(function (o) {
        if (!q) return true;
        return (o.r.name || "").toLowerCase().indexOf(q) >= 0 || (o.r.note || "").toLowerCase().indexOf(q) >= 0;
      })
      .sort(function (a, b) { return (b.r.date || "").localeCompare(a.r.date || ""); });
    if (!rows.length) { box.innerHTML = '<li class="empty">' + (q ? "没有匹配的记录" : "还没有记录，上面添加一条吧～") + '</li>'; }
    rows.forEach(function (o) {
      var r = o.r;
      var li = document.createElement("li");
      li.className = "rec-item";
      li.innerHTML = '<span class="rec-date">' + escapeHtml(r.date || "") + '</span>'
        + '<span class="rec-body"><b class="rec-name">' + escapeHtml(r.name || "") + '</b>'
        + (r.note ? '<span class="rec-note">' + escapeHtml(r.note) + '</span>' : '') + '</span>';
      var del = document.createElement("button"); del.className = "del"; del.textContent = "✕"; del.title = "删除";
      del.onclick = function () { records.splice(o.i, 1); save(KEY.record, records); renderRecords(); };
      li.appendChild(del); box.appendChild(li);
    });
    $("recCount").textContent = rows.length;
  }
  $("recAdd").onclick = function () {
    var date = $("recDate").value || todayStr();
    var name = $("recName").value.trim();
    var note = $("recNote").value.trim();
    if (!name) { alert("请填写文件名"); return; }
    records.push({ type: recType, date: date, name: name, note: note });
    save(KEY.record, records);
    $("recName").value = ""; $("recNote").value = "";
    renderRecords();
  };
  $("recNote").addEventListener("keydown", function (e) { if (e.key === "Enter") $("recAdd").click(); });
  $("recName").addEventListener("keydown", function (e) { if (e.key === "Enter") $("recNote").focus(); });
  $("recSearch").addEventListener("input", renderRecords);
  renderRecords();

  // Backup / restore
  $("backupBtn").onclick = function () {
    var data = { todo: todos, note: notes, link: links, habit: habits, habitList: habitList, habitColors: habitColors, habitIcons: habitIcons, theme: theme, record: records, _v: 2 };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "工作台备份_" + todayStr() + ".json"; a.click(); URL.revokeObjectURL(a.href);
  };
  $("restoreBtn").onclick = function () { $("restoreFile").click(); };
  $("restoreFile").onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (d.todo) { todos = d.todo; save(KEY.todo, todos); renderTodo(); }
        if (d.note) { notes = d.note; save(KEY.note, notes); loadNote($("noteDate").value || todayStr()); }
        if (d.link) { links = d.link; save(KEY.link, links); renderLinks(); }
        if (d.habit) { habits = d.habit; save(KEY.habit, habits); }
        if (d.habitList) { habitList = d.habitList; save(KEY.habitList, habitList); }
        if (d.habitColors) { habitColors = d.habitColors; save(KEY.habitColors, habitColors); }
        if (d.habitIcons) { habitIcons = d.habitIcons; save(KEY.habitIcons, habitIcons); }
        if (!habitColors || typeof habitColors !== "object") habitColors = {};
        if (!habitIcons || typeof habitIcons !== "object") habitIcons = {};
        habitList.forEach(function (h, i) { if (!habitColors[h]) habitColors[h] = PALETTE[i % PALETTE.length]; if (!habitIcons[h]) habitIcons[h] = DEF_ICONS[h] || "🔵"; });
        if (!curHabit || habitList.indexOf(curHabit) < 0) curHabit = habitList[0] || "";
        renderHabitList(); renderMonth();
        if (d.record) { records = d.record; if (!Array.isArray(records)) records = []; save(KEY.record, records); renderRecords(); }
        if (d.theme) { theme = d.theme; applyTheme(theme); }
        alert("恢复成功 ✅");
      } catch (err) { alert("文件格式不正确"); }
    };
    r.readAsText(f); e.target.value = "";
  };
})();
</script>
<script>
  if (location.protocol.startsWith('http')) {
    window.addEventListener('load', function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            nw.addEventListener('statechange', function () {
              if (nw.state === 'installed') nw.postMessage({ type: 'SKIP_WAITING' });
            });
          });
        }).catch(function () {});
        navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); });
      }
    });
  }
</script>
